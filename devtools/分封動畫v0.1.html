<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<base href="../">
<title>分封動畫</title>
<meta name="description" content="一場打完的分封領地動畫（預覽，還沒接進遊戲）">
<meta name="launcher-icon" content="🏯">
<meta name="launcher-cat" content="動畫">
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Serif+TC:wght@500;700&display=swap">
<!--
  分封領地 —— 一場打完，前三名各征服一國（docs/campaign.md 第二節）。

  演出（每一位拿到封地的主公輪流，名次從後往前，第一名壓軸）：
    ① 字幕：「第二名　阿明（韓）」
    ② 被征服的那一國發光
    ③ 主公從**自己的本國**出兵，一路播出征三格（蓄勢→出招→進攻）衝到那一國
    ④ 抵達：一閃、蓋上紅色「征服」大印、插上本國的旗
    ⑤ 換成平靜姿勢，縮成頭像留在那一國上（跟天下形勢地圖同一種頭像）
  墊底的人沒有封地：「此戰未得寸土」。電腦守將不是主公，不演。

  ⚠️ 這一頁只是預覽，還沒接進遊戲（使用者 2026-09-25：「不要接入遊戲，先做給我看看」）。
     地圖座標 MAP_POS 抄自主程式 showWarMap，改的話兩邊要一起改。
-->
<style>
:root{
  --gold:#c9a44c;
  --font-deco:'ZCOOL QingKe HuangYou','Noto Serif TC','Songti TC',serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#050c09;color:#e8dcc0;font-family:'Noto Serif TC','Songti TC',serif;overflow:hidden;}

#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 12px;}
.title{font-family:var(--font-deco);font-size:clamp(20px,5vh,34px);color:var(--gold);letter-spacing:.35em;
  text-shadow:0 2px 10px rgba(0,0,0,.8);}
.sub{font-size:clamp(10px,2vh,13px);color:rgba(232,220,192,.6);letter-spacing:.3em;margin-top:-4px;}

/* 地圖 3:2，高度留給標題、字幕與按鈕 */
.map{position:relative;width:min(94vw,calc((100vh - 150px) * 1.5),1100px);aspect-ratio:3/2;
  border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.75),0 0 0 1px rgba(201,164,76,.5);}
.map > img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;filter:saturate(.85) brightness(.92);}

/* 各國的印（國名） */
.seal{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-deco);
  font-size:clamp(13px,3.2vh,24px);line-height:1;color:#fff4d6;width:1.7em;height:1.7em;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:rgba(40,22,10,.6);border:2px solid rgba(255,236,190,.5);text-shadow:0 1px 2px #000;z-index:2;
  transition:background .4s,border-color .4s,box-shadow .4s;}
.seal.owned{background:var(--kc);border-color:#f3cf6e;box-shadow:0 0 12px rgba(243,207,110,.8);}

/* 已經有主公的國：頭像排在印下面 */
.owners{position:absolute;transform:translate(-50%,0);display:flex;gap:2px;z-index:3;}
.owners img{width:clamp(20px,5vh,38px);height:clamp(20px,5vh,38px);border-radius:50%;
  background:#f3e6c4;border:2px solid var(--kc,#f3cf6e);box-shadow:0 2px 6px rgba(0,0,0,.6);}
.owners img.new{animation:badgeIn .5s cubic-bezier(.2,1.6,.4,1) both;}
@keyframes badgeIn{from{transform:scale(0)}to{transform:scale(1)}}

/* 被征服的那一國發光（地圖不是分區圖層，用一團光暈蓋在那一國中間） */
.glow{position:absolute;transform:translate(-50%,-50%);width:34%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--kc) 0%,transparent 62%);mix-blend-mode:screen;opacity:0;z-index:1;pointer-events:none;}
.glow.on{animation:glowPulse 1.1s ease-in-out infinite alternate;}
.glow.won{animation:none;opacity:.55;transition:opacity .6s;}
@keyframes glowPulse{from{opacity:.15}to{opacity:.55}}

/* 出征的主公：腳踩在座標上 */
.lord{position:absolute;width:30%;aspect-ratio:1;transform:translate(-50%,-78%);z-index:5;pointer-events:none;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.8));}
.lord img{width:100%;height:100%;object-fit:contain;display:block;}
.lord.flip img{transform:scaleX(-1);}
/* 行軍揚起的煙塵 */
.dust{position:absolute;width:5%;aspect-ratio:1;border-radius:50%;background:rgba(214,190,140,.55);
  transform:translate(-50%,-50%);z-index:4;pointer-events:none;animation:dust .7s ease-out forwards;}
@keyframes dust{from{opacity:.8;transform:translate(-50%,-50%) scale(.4)}to{opacity:0;transform:translate(-50%,-80%) scale(1.8)}}

/* 抵達的一閃 */
.flash{position:absolute;inset:0;background:radial-gradient(circle at var(--fx) var(--fy),rgba(255,245,210,.95),transparent 45%);
  z-index:6;pointer-events:none;animation:flash .45s ease-out forwards;}
@keyframes flash{from{opacity:1}to{opacity:0}}

/* 紅色「征服」大印 */
.stamp{position:absolute;transform:translate(-50%,-50%) rotate(-10deg);z-index:7;pointer-events:none;
  font-family:var(--font-deco);font-size:clamp(20px,6vh,44px);color:#c0281c;letter-spacing:.05em;
  border:4px solid #c0281c;border-radius:6px;padding:.05em .25em;background:rgba(255,240,215,.2);
  text-shadow:0 0 1px #c0281c;animation:stampIn .5s cubic-bezier(.3,1.5,.5,1) both;mix-blend-mode:multiply;}
.stamp.fade{transition:opacity .6s;opacity:0;}
@keyframes stampIn{from{opacity:0;transform:translate(-50%,-50%) rotate(-18deg) scale(2.4)}
  to{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}}

/* 插旗 */
.flag{position:absolute;z-index:4;pointer-events:none;transform:translate(-2px,-100%);
  width:3px;height:clamp(26px,7vh,52px);background:linear-gradient(#6b4a1a,#3a2508);
  animation:flagIn .4s ease-out both;transform-origin:bottom;}
.flag::after{content:attr(data-c);position:absolute;left:3px;top:0;
  width:clamp(18px,4.6vh,34px);height:clamp(13px,3.4vh,25px);background:var(--kc);color:#fff;
  font-family:var(--font-deco);font-size:clamp(10px,2.4vh,18px);display:flex;align-items:center;justify-content:center;
  clip-path:polygon(0 0,100% 0,85% 50%,100% 100%,0 100%);animation:wave 1.2s ease-in-out infinite alternate;transform-origin:left;}
@keyframes flagIn{from{transform:translate(-2px,-100%) scaleY(0)}to{transform:translate(-2px,-100%) scaleY(1)}}
@keyframes wave{from{transform:skewY(-4deg)}to{transform:skewY(4deg)}}

/* 字幕 */
.cap{min-height:2.6em;text-align:center;font-size:clamp(13px,3vh,19px);letter-spacing:.12em;}
.cap .rank{font-family:var(--font-deco);color:var(--gold);margin-right:.6em;}
.cap .who{color:#fff4d6;}
.cap .got{color:#f3cf6e;font-weight:700;}
.cap .none{color:rgba(232,220,192,.6);}
.cap.in{animation:capIn .4s ease both;}
@keyframes capIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

/* 預覽用的控制列 */
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:12px;}
.ctl button{font:inherit;color:#e8dcc0;background:rgba(20,40,30,.85);border:1px solid rgba(201,164,76,.45);
  border-radius:6px;padding:4px 12px;cursor:pointer;}
.ctl button.on{background:var(--gold);color:#23180a;}
.hint{font-size:10px;color:rgba(232,220,192,.4);letter-spacing:.2em;}
</style>
</head>
<body>
<div id="stage">
  <div class="title">分封領地</div>
  <div class="sub">— 打敗誰，就拿誰的地 —</div>
  <div class="map" id="map"><img class="bg" src="assets/map/warring-states.webp" alt=""></div>
  <div class="cap" id="cap"></div>
  <div class="ctl" id="ctl"></div>
  <div class="hint">點地圖跳到結果</div>
</div>

<script src="src/kingdoms.js"></script>
<script>
'use strict';
const K = window.MJKingdoms;
const byId = id => document.getElementById(id);
const MAP_POS = {           // 抄自主程式 showWarMap（各國區塊中心，佔圖寬高的百分比）
  qin: [19, 42], zhao: [47.5, 17], yan: [73, 17], qi: [73, 40],
  wei: [53, 41], han: [36.5, 40], chu: [51, 66],
};
const RANK = ['', '第一名', '第二名', '第三名', '第四名'];

/* 範例情境。lords＝名冊上的主公（本國＋之前的征服地）；awards＝這一場的結果（照名次）。
   gained 是 null 的是墊底（沒有封地）；電腦守將不列進 awards。 */
const SCENES = {
  '連線三位主公': {
    lords: [
      { name: '小球貓', home: 'qi',  conquered: ['han'] },
      { name: '阿明',   home: 'chu', conquered: [] },
      { name: '小華',   home: 'zhao', conquered: ['yan'] },
    ],
    awards: [
      { rank: 1, name: '小球貓', gained: 'wei' },
      { rank: 2, name: '阿明',   gained: 'yan' },
      { rank: 3, name: '小華',   gained: 'qin' },
      { rank: 4, name: '（燕將樂毅）', gained: null, ai: true },
    ],
  },
  '單機：我拿第一': {
    lords: [{ name: '齊威王', home: 'qi', conquered: ['han', 'wei'] }],
    awards: [{ rank: 1, name: '齊威王', gained: 'chu' }],
  },
  '連線：我墊底': {
    lords: [
      { name: '小球貓', home: 'qin', conquered: ['zhao'] },
      { name: '阿明',   home: 'han', conquered: [] },
    ],
    awards: [
      { rank: 2, name: '阿明',   gained: 'wei' },
      { rank: 4, name: '小球貓', gained: null },
    ],
  },
};

let scene = Object.keys(SCENES)[0];
let timers = [];
let running = false;
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
const pos = id => MAP_POS[id] || [50, 50];
const kc = id => (K.get(id) || {}).color || '#c9a44c';

/* ── 地圖：印＋頭像 ───────────────────────────────────── */
function paintMap(lords, highlight) {
  const map = byId('map');
  map.querySelectorAll(':scope > :not(img.bg)').forEach(n => n.remove());
  const owners = {};
  lords.forEach(l => [l.home].concat(l.conquered).forEach((id, j) => {
    (owners[id] = owners[id] || []).push({ l, home: j === 0, fresh: l.fresh === id });
  }));
  K.KINGDOMS.forEach(k => {
    const [x, y] = pos(k.id);
    const own = owners[k.id] || [];
    const s = document.createElement('div');
    s.className = 'seal' + (own.length ? ' owned' : '');
    s.id = 'seal-' + k.id;
    s.style.left = x + '%'; s.style.top = y + '%';
    // 印的顏色：有主公的國用**本國是這一國的那位**，沒有的話用第一位征服者的本國色
    const first = own.find(o => o.home) || own[0];
    if (first) s.style.setProperty('--kc', kc(first.l.home));
    s.textContent = k.char;
    map.appendChild(s);
    if (own.length) {
      const o = document.createElement('div');
      o.className = 'owners';
      o.id = 'own-' + k.id;
      o.style.left = x + '%'; o.style.top = 'calc(' + y + '% + 2.1vh)';
      own.forEach(w => {
        const im = document.createElement('img');
        im.src = K.avatarUrl(w.l.home);
        im.style.setProperty('--kc', kc(w.l.home));
        if (w.fresh) im.className = 'new';
        o.appendChild(im);
      });
      map.appendChild(o);
    }
  });
}

/* ── 一位主公的出征 ───────────────────────────────────── */
function playOne(lords, a, done) {
  const cap = byId('cap');
  const map = byId('map');
  const lord = lords.find(l => l.name === a.name);
  cap.className = 'cap';
  void cap.offsetWidth;
  cap.className = 'cap in';

  if (!a.gained || !lord) {          // 墊底／電腦：沒有封地
    cap.innerHTML = `<span class="rank">${RANK[a.rank]}</span><span class="who">${a.name}</span>　<span class="none">此戰未得寸土</span>`;
    later(done, 1600);
    return;
  }
  const g = K.get(a.gained);
  const home = K.get(lord.home);
  cap.innerHTML = `<span class="rank">${RANK[a.rank]}</span><span class="who">${a.name}（${home.char}）</span>　出兵${g.name}⋯`;

  // ② 目標發光
  const [tx, ty] = pos(g.id), [hx, hy] = pos(home.id);
  const glow = document.createElement('div');
  glow.className = 'glow on';
  glow.style.left = tx + '%'; glow.style.top = ty + '%';
  glow.style.setProperty('--kc', kc(home.id));
  map.appendChild(glow);

  // ③ 出兵：從本國衝向目標，播出征三格
  const sp = document.createElement('div');
  sp.className = 'lord' + (tx < hx ? ' flip' : '');   // 往左打就轉身
  const img = document.createElement('img');
  sp.appendChild(img);
  const frames = K.warFrames(home.id, false);
  img.src = frames[0];
  sp.style.left = hx + '%'; sp.style.top = hy + '%';
  map.appendChild(sp);

  const MARCH = 1300;
  later(() => {
    img.src = frames[1];
    // 弧線行軍：中途抬高一點，像是翻山越嶺
    const mx = (hx + tx) / 2, my = Math.min(hy, ty) - 8;
    sp.animate([
      { left: hx + '%', top: hy + '%' },
      { left: mx + '%', top: my + '%', offset: .5 },
      { left: tx + '%', top: ty + '%' },
    ], { duration: MARCH, easing: 'ease-in', fill: 'forwards' });
    // 一路揚起煙塵
    for (let i = 1; i <= 6; i++) later(() => {
      const t = i / 7;
      const x = (1 - t) * (1 - t) * hx + 2 * (1 - t) * t * mx + t * t * tx;
      const y = (1 - t) * (1 - t) * hy + 2 * (1 - t) * t * my + t * t * ty;
      const d = document.createElement('div');
      d.className = 'dust';
      d.style.left = x + '%'; d.style.top = (y + 1) + '%';
      map.appendChild(d);
      later(() => d.remove(), 800);
    }, MARCH * i / 7);
  }, 550);
  later(() => { img.src = frames[2]; }, 550 + 380);          // 進攻

  // ④ 抵達：一閃、大印、插旗、這一國換上主公的顏色
  const ARRIVE = 550 + MARCH;
  later(() => {
    const f = document.createElement('div');
    f.className = 'flash';
    f.style.setProperty('--fx', tx + '%'); f.style.setProperty('--fy', ty + '%');
    map.appendChild(f);
    later(() => f.remove(), 500);

    const st = document.createElement('div');
    st.className = 'stamp';
    st.textContent = '征服';
    st.style.left = tx + '%'; st.style.top = (ty - 1) + '%';
    map.appendChild(st);

    const fl = document.createElement('div');
    fl.className = 'flag';
    fl.dataset.c = home.char;
    fl.style.setProperty('--kc', kc(home.id));
    fl.style.left = (tx + 4) + '%'; fl.style.top = (ty + 2) + '%';
    map.appendChild(fl);

    glow.className = 'glow won';
    const seal = byId('seal-' + g.id);
    if (seal) { seal.classList.add('owned'); seal.style.setProperty('--kc', kc(home.id)); }
    cap.innerHTML = `<span class="rank">${RANK[a.rank]}</span><span class="who">${a.name}（${home.char}）</span>　征服 <span class="got">${g.name}</span>！`;
  }, ARRIVE);

  // ⑤ 平靜下來，縮成頭像留在那一國
  later(() => { img.src = K.calmUrl(home.id, false); }, ARRIVE + 350);
  later(() => {
    sp.animate([{ opacity: 1, transform: 'translate(-50%,-78%) scale(1)' },
                { opacity: 0, transform: 'translate(-50%,-40%) scale(.25)' }],
               { duration: 450, easing: 'ease-in', fill: 'forwards' });
    const s = byId('map').querySelector('.stamp'); if (s) s.classList.add('fade');
  }, ARRIVE + 1500);
  later(() => {
    sp.remove();
    lord.conquered = lord.conquered.concat([g.id]);
    lord.fresh = g.id;
    const keep = [...map.querySelectorAll('.glow.won,.flag')];
    paintMap(lords);
    keep.forEach(n => map.appendChild(n));
    done();
  }, ARRIVE + 1950);
}

/* ── 整段：名次從後往前，第一名壓軸 ───────────────────── */
function preload(sc) {
  sc.lords.forEach(l => K.warFrames(l.home, false).concat([K.calmUrl(l.home, false)])
    .forEach(u => { const i = new Image(); i.src = u; }));
}

function play() {
  stop();
  running = true;
  const sc = JSON.parse(JSON.stringify(SCENES[scene]));
  preload(sc);
  paintMap(sc.lords);
  const list = sc.awards.filter(a => !a.ai).sort((a, b) => b.rank - a.rank);
  byId('cap').innerHTML = '';
  let i = 0;
  const next = () => {
    if (i >= list.length) { finish(sc); return; }
    playOne(sc.lords, list[i++], () => later(next, 400));
  };
  later(next, 700);
}

function finish(sc) {
  running = false;
  const got = sc.awards.filter(a => a.gained && !a.ai).sort((a, b) => a.rank - b.rank);
  byId('cap').className = 'cap in';
  byId('cap').innerHTML = got.length
    ? got.map(a => `<span class="who">${a.name}</span> <span class="got">${K.get(a.gained).char}</span>`).join('　·　')
    : '<span class="none">此戰無人得地</span>';
}

/* 點地圖：跳到結果 */
function skip() {
  if (!running) return;
  stop();
  const sc = JSON.parse(JSON.stringify(SCENES[scene]));
  sc.awards.forEach(a => {
    const l = sc.lords.find(x => x.name === a.name);
    if (l && a.gained) { l.conquered.push(a.gained); l.fresh = a.gained; }
  });
  paintMap(sc.lords);
  finish(sc);
}

function stop() {
  timers.forEach(clearTimeout); timers = [];
  byId('map').getAnimations({ subtree: true }).forEach(a => { try { a.cancel(); } catch (_) {} });
}

/* ── 預覽控制列 ───────────────────────────────────────── */
function buildCtl() {
  const c = byId('ctl');
  c.innerHTML = '';
  Object.keys(SCENES).forEach(name => {
    const b = document.createElement('button');
    b.textContent = name;
    if (name === scene) b.className = 'on';
    b.onclick = () => { scene = name; buildCtl(); play(); };
    c.appendChild(b);
  });
  const r = document.createElement('button');
  r.textContent = '↻ 再播一次';
  r.onclick = play;
  c.appendChild(r);
}

byId('map').addEventListener('click', skip);
buildCtl();
play();
</script>
</body>
</html>
