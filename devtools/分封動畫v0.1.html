<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<base href="../">
<title>分封動畫</title>
<meta name="description" content="一場打完的分封領地動畫（遊戲裡用的同一支 src/enfeoff.js）">
<meta name="launcher-icon" content="🏯">
<meta name="launcher-cat" content="動畫">
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Serif+TC:wght@500;700&display=swap">
<!--
  分封領地的預覽。動畫本身在 src/enfeoff.js（遊戲一場打完也是呼叫它），這一頁只放幾組範例情境。
  v1.19 起已經接進遊戲。
-->
<style>
html,body{height:100%;margin:0;background:#050c09;color:#e8dcc0;font-family:'Noto Serif TC','Songti TC',serif;}
.ctl{position:fixed;left:0;right:0;bottom:8px;z-index:200;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:12px;}
.ctl button{font:inherit;color:#e8dcc0;background:rgba(20,40,30,.9);border:1px solid rgba(201,164,76,.45);border-radius:6px;padding:4px 12px;cursor:pointer;}
.ctl button.on{background:#c9a44c;color:#23180a;}
.idle{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(232,220,192,.5);}
.gobtn{font:inherit;font-size:18px;color:#23180a;background:#c9a44c;border:0;border-radius:10px;padding:12px 26px;cursor:pointer;}
</style>
</head>
<body>
<div class="idle"><button id="go" class="gobtn">▶ 點一下開始播放（有聲音）</button></div>
<div class="ctl" id="ctl"></div>
<script src="src/kingdoms.js"></script>
<script src="src/enfeoff.js"></script>
<script>
'use strict';
const SCENES = {
  '連線三位主公': {
    lords: [
      { name: '小球貓', home: 'qi',  conquered: ['han'] },
      { name: '阿明',   home: 'chu', conquered: [] },
      { name: '小華',   home: 'zhao', conquered: ['yan'] },
    ],
    awards: [
      { rank: 1, name: '小球貓', gained: 'wei' },
      { rank: 2, name: '阿明',   gained: 'yan' },
      { rank: 3, name: '小華',   gained: 'qin' },
    ],
  },
  '單機：我拿第一': {
    lords: [{ name: '齊威王', home: 'qi', conquered: ['han', 'wei'] }],
    awards: [{ rank: 1, name: '齊威王', gained: 'chu' }],
  },
  '連線：我墊底': {
    lords: [
      { name: '小球貓', home: 'qin', conquered: ['zhao'] },
      { name: '阿明',   home: 'han', conquered: [] },
    ],
    awards: [
      { rank: 2, name: '阿明',   gained: 'wei' },
      { rank: 4, name: '小球貓', gained: null },
    ],
  },
};
let scene = Object.keys(SCENES)[0];
function play() { MJEnfeoff.play(SCENES[scene]); }
function buildCtl() {
  const c = document.getElementById('ctl');
  c.innerHTML = '';
  Object.keys(SCENES).forEach(name => {
    const b = document.createElement('button');
    b.textContent = name;
    if (name === scene) b.className = 'on';
    b.onclick = () => { scene = name; buildCtl(); play(); };
    c.appendChild(b);
  });
  const r = document.createElement('button');
  r.textContent = '↻ 再播一次';
  r.onclick = play;
  c.appendChild(r);
}
/* ⚠️ 不要一打開就自動播：瀏覽器規定網頁被點過之前不准出聲（AudioContext 會停在 suspended），
   自動播的那一次一定是靜音的（2026-09-25 使用者：「啟動台的分封動畫沒有聲音」）。
   遊戲裡沒有這個問題 —— 打到一場結束之前一定點過畫面。 */
buildCtl();
document.getElementById('go').onclick = () => {
  document.querySelector('.idle').innerHTML = '播完了 —— 選一組情境再播一次';
  play();
};
</script>
</body>
</html>
