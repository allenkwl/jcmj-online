<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<base href="../">
<title>統一天下動畫</title>
<meta name="description" content="舊版：獨立頁面呼叫 src/unify.js（v0.2 改成直接在遊戲裡播）">
<meta name="launcher-icon" content="👑">
<meta name="launcher-cat" content="動畫">
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap">
<!--
  天下一統的預覽。動畫在 src/unify.js，配樂 assets/audio/unify-bgm.mp3
  （MIDI 由 tools/build-unify-bgm-midi.py 產生、tools/render-bgm.sh 轉 MP3；也可以匯入 GarageBand 換樂器再輸出蓋掉）。
  ⚠️ 還沒接進遊戲（使用者 2026-09-25：「同樣先測試不接入遊戲」）。
  ⚠️ 要按一下才播：瀏覽器規定網頁被點過之前不准出聲。
-->
<style>
:root{--font-deco:'Noto Serif TC','Songti TC',serif;}
html,body{height:100%;margin:0;background:#050c09;color:#e8dcc0;font-family:'Noto Serif TC','Songti TC',serif;}
.idle{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px;}
.row button{font:inherit;color:#e8dcc0;background:rgba(20,40,30,.9);border:1px solid rgba(201,164,76,.45);border-radius:6px;padding:5px 12px;cursor:pointer;}
.row button.on{background:#c9a44c;color:#23180a;}
.go{font:inherit;font-size:18px;color:#23180a;background:#c9a44c;border:0;border-radius:10px;padding:12px 26px;cursor:pointer;}
.note{font-size:12px;color:rgba(232,220,192,.55);}
</style>
</head>
<body>
<div class="idle">
  <div class="row" id="kgs"></div>
  <button class="go" id="go">▶ 點一下開始播放（有聲音）</button>
  <div class="note" id="note">配樂：assets/audio/unify-bgm.mp3（沒有的話改用瀏覽器合成 MIDI 的音符）</div>
</div>
<script src="src/kingdoms.js"></script>
<script src="src/enfeoff.js"></script>
<script src="assets/audio/unify-bgm.notes.js"></script>
<script src="src/unify.js"></script>
<script>
'use strict';
const K = window.MJKingdoms;
let pick = 'qi';
function lordOf(k) { const n = k.kingName || ''; const i = n.lastIndexOf('王'); return i >= 0 ? n.slice(0, i + 1) : k.name; }
function buildKgs() {
  const box = document.getElementById('kgs');
  box.innerHTML = '';
  K.KINGDOMS.forEach(k => {
    const b = document.createElement('button');
    b.textContent = k.name;
    if (k.id === pick) b.className = 'on';
    b.onclick = () => { pick = k.id; buildKgs(); };
    box.appendChild(b);
  });
}
document.getElementById('go').onclick = () => {
  const k = K.get(pick);
  MJUnify.play({
    name: lordOf(k), kingdom: k.id,
    conquered: K.KINGDOMS.map(x => x.id).filter(id => id !== k.id),
    matches: 12,
  }).then(() => { document.getElementById('go').textContent = '↻ 再播一次'; });
};
buildKgs();
</script>
</body>
</html>
