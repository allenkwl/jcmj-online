<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>開場動畫</title>
<meta name="description" content="30 秒開場序章（直接播遊戲本體裡的那一份，可跳幕）">
<meta name="launcher-icon" content="🎬">
<meta name="launcher-cat" content="動畫">
<!--
  開場序章的預覽。⚠️ 這一頁**沒有自己的動畫**：用 iframe 載最新版遊戲的 #intro 模式，
  跑的是遊戲裡同一份 DOM／CSS／src/intro.js（跟對戰畫面編輯器載 #preview 是同一招）。

  為什麼：v0.1（原本的 `開場動畫測試.html`）是搬進遊戲之前的獨立測試頁。
  搬進遊戲之後序章又改了很多（標題換成魏碑圖、字型換成正體、第四幕背景重做…），
  測試頁沒跟著改，啟動台看到的就一直是舊的（2026-09-25 使用者：「更新啟動台裡面的 30 秒開場動畫」）。
  現在只有一份，改遊戲就等於改這裡。

  載哪一版看 ../latest.js（bump-version.py 會更新它）。iframe 只顯示、不跨框讀東西，所以雙擊（file://）也能開。
-->
<style>
html,body{height:100%;margin:0;background:#050c09;}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;}
.err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#e8c46a;font:14px 'Songti TC',serif;}
</style>
</head>
<body>
<script src="../latest.js"></script>
<script>
'use strict';
const file = window.MJ_LATEST && window.MJ_LATEST.file;
if (!file) {
  document.body.insertAdjacentHTML('beforeend', '<div class="err">⚠ 讀不到 ../latest.js，不知道該載哪一版遊戲</div>');
} else {
  const f = document.createElement('iframe');
  f.src = '../' + encodeURI(file) + '#intro';
  f.allow = 'autoplay; fullscreen';
  f.title = '開場序章';
  document.body.appendChild(f);
  document.title = '開場動畫（' + (file.match(/v\d+\.\d+/) || [''])[0] + '）';
}
</script>
</body>
</html>
