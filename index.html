<body>
<p id="msg">正在載入戰國麻將……</p>
<script>
/* GitHub Pages 的入口，也是「加到主畫面」開啟的地方（manifest 的 start_url 指這裡）。
   比照小球貓電鐵：這一頁**不寫死版號**（除了下面那個備援）。
   Safari 會把固定網址的入口頁快取起來 —— 版號寫死在這裡的話，改版後玩家怎麼重整都被送到舊版。
   改成每次載入時去問 latest.json 現在最新是哪一版，那個請求帶時間戳，一定拿得到新的。
   ⚠️ 遊戲檔不要命名成「戰國麻將列傳.html」—— 那個檔名會觸發舊兩人版的自動部署。 */
(function () {
  var fallback = '戰國麻將線上v1.08.html';
  var tail = location.search + location.hash;
  function go(f) { location.replace(encodeURIComponent(f) + tail); }
  fetch('latest.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { go(d.file); })
    .catch(function () { go(fallback); });   // 抓不到就走備援，至少進得去
})();
</script>
<noscript><a href="戰國麻將線上v1.08.html">請點這裡進入遊戲</a></noscript>
</body>
